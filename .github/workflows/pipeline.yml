name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: pip3 install --user -r requirements.txt

      - name: Run tests
        run: python3 -m pytest tests/ -v

  build-push:
    name: Build and Push Docker Image
    runs-on: self-hosted
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo:${{ github.sha }} .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: build-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image tag
        run: |
          sed -i "s|image: specialthing/cicd-demo:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo:${{ github.sha }}|g" k8s/deployment.yaml

      - name: Deploy to K8s
        run: kubectl apply -f k8s/deployment.yaml

      - name: Verify rollout
        run: kubectl rollout status deployment/cicd-demo --timeout=120s

      - name: Confirm pods running
        run: kubectl get pods -l app=cicd-demo
